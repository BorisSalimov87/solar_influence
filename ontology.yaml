# Онтология проекта: классы, отношения, правила.
# Источник истины для графа проекта. Формат — practice.md недели 4.

ontology: solar-influence
goal: >
  Записывать ход исследования связи полного электронного содержания (GEC) с площадью
  областей, похожих на корональные дыры, так, чтобы по графу проекта можно было
  ответить: какие задачи поставлены и чем закрыты, какие расчёты выполнены и на каких
  данных, какие файлы получены скачиванием и где они лежат.

competency_questions:
  - Какие задачи поставлены, из каких подзадач состоят и в каком они статусе?
  - Какие расчёты выполнены, на каких данных они основаны и какие задачи закрывают?
  - Какие файлы созданы скачиванием и где они лежат?
  - В каких файлах лежат исходные данные и результаты отбора GEC?

classes:
  ИнформационныйОбъект:
    parent: null
    definition: объект, который несёт сведения — задача, утверждение, данные, метод, текст
  Процесс:
    parent: null
    definition: то, что происходит во времени — опыт, расчёт, проверка
  Файл:
    parent: null
    definition: файл проекта — таблица, код, текст, источник; узел графа — сам файл, заметка о нём не нужна
  Задача:
    parent: ИнформационныйОбъект
    definition: поручение пользователя или его часть; заметки задач в tasks/ ведёт агент
  Данные:
    parent: Файл
    definition: таблица CSV с данными
  Расчет:
    parent: Задача
    definition: поручение пользователя что-то рассчитать
  Скачивание:
    parent: Процесс
    definition: скачивание данных, статей и т.д.
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа, на которую ссылаются; текст — в library/
  Автор:
    parent: null
    definition: человек — автор опубликованной работы
  ЗапросКГрафу:
    parent: Процесс
    definition: обращение к внешнему графу знаний — источник, инструмент и аргументы, дата, число найденных записей
  Гипотеза:
    parent: ИнформационныйОбъект
    definition: утверждение о связи GEC и площади областей, похожих на CH, которое проверяют по данным 2025 г.
  Метод:
    parent: ИнформационныйОбъект
    definition: способ обработки данных или расчёта, применённый в проекте

properties:
  подзадачаОт: {domain: Задача, range: Задача, characteristics: [транзитивное]}
  использует:  {domain: Расчет, range: Данные}
  закрывает:   {domain: Расчет, range: Задача}
  создаёт:     {domain: Скачивание, range: Файл}
  найденЗапросом: {domain: Источник, range: ЗапросКГрафу}
  написан:        {domain: Источник, range: Автор}
  цитирует:       {domain: Источник, range: Источник}
  хранитсяВ:      {domain: Источник, range: Файл}
  решает:         {domain: ЗапросКГрафу, range: Задача}
  основанНа:      {domain: [Гипотеза, Метод], range: Источник}

attributes:
  status:
    domain: Задача
    values: [открыта, в работе, выполнена, заблокирована, принята]
  oa_status:
    domain: Источник
    values: [diamond, gold, hybrid, green, bronze, closed]

rules:
  - id: П1
    text: Каждый расчёт использует хотя бы одни данные.
    dl: "Расчет ⊑ ∃использует.Данные"
    check: {kind: some, class: Расчет, property: использует, target: Данные}
  - id: П2
    text: Каждый расчёт закрывает хотя бы одну задачу.
    dl: "Расчет ⊑ ∃закрывает.Задача"
    check: {kind: some, class: Расчет, property: закрывает, target: Задача}
  - id: П3
    text: Каждое скачивание создаёт хотя бы один файл.
    dl: "Скачивание ⊑ ∃создаёт.Файл"
    check: {kind: some, class: Скачивание, property: создаёт, target: Файл}
  - id: Л1
    text: Каждый источник указывает запрос к внешнему графу, которым он найден или сверен.
    dl: "Источник ⊑ ∃найденЗапросом.ЗапросКГрафу"
    check: {kind: some, class: Источник, property: найденЗапросом, target: ЗапросКГрафу}
  - id: Л2
    text: У каждого источника записан хотя бы один автор.
    dl: "Источник ⊑ ∃написан.Автор"
    check: {kind: some, class: Источник, property: написан, target: Автор}
